<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monarch Awards 2026 – 3D Venue Walkthrough</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #chips{position:fixed;top:10px;left:10px;right:150px;display:flex;flex-wrap:wrap;gap:6px;z-index:5}
  #chips button{font:600 12px/1 inherit;letter-spacing:.04em;color:#e8f1ff;background:rgba(10,20,45,.72);
    border:1px solid rgba(120,170,255,.45);border-radius:999px;padding:9px 12px;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #chips button.on{background:#2f6bff;border-color:#9cc0ff}
  #map{position:fixed;top:10px;right:10px;width:132px;height:106px;border-radius:8px;z-index:5;
    border:1px solid rgba(120,170,255,.45);background:rgba(5,10,25,.75)}
  #hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#b9c8e6;
    text-shadow:0 1px 3px #000;pointer-events:none;z-index:4;padding:0 150px}
  #stick{position:fixed;left:22px;bottom:26px;width:124px;height:124px;border-radius:50%;z-index:6;
    background:rgba(120,170,255,.12);border:1.5px solid rgba(160,200,255,.5);display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(200,225,255,.75);box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .touch #stick{display:block}
  .touch #hint{padding:0 12px 0 160px;text-align:right;bottom:18px}
  #intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(8,20,60,.82),rgba(2,4,10,.96));text-align:center;padding:24px}
  #intro h1{font-size:13px;letter-spacing:.35em;font-weight:600;color:#9cc0ff;margin:0 0 10px}
  #intro h2{font-size:28px;letter-spacing:.12em;font-weight:300;margin:0 0 18px}
  #intro p{font-size:14px;line-height:1.5;color:#c9d6ee;max-width:420px;margin:0 auto 20px}
  #intro button{font:600 15px/1 inherit;letter-spacing:.08em;color:#fff;background:#2f6bff;border:0;
    border-radius:999px;padding:15px 34px;cursor:pointer}
  #intro small{display:block;margin-top:18px;color:#8090b0;font-size:11px;line-height:1.5}
  #hint{left:50%;right:auto;transform:translateX(-50%);padding:6px 12px;background:rgba(6,12,30,.55);border-radius:999px;white-space:nowrap}
  .touch #hint{left:auto;right:12px;transform:none;padding:6px 12px}
  @media (max-width:760px){
    #chips{right:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:4px}
    #chips::-webkit-scrollbar{display:none}
    #chips button{flex:0 0 auto}
    #map{top:56px}
  }
  #err{position:fixed;inset:auto 10px 10px 10px;color:#ffb4b4;font-size:12px;z-index:20}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="chips"></div>
<canvas id="map" width="264" height="212"></canvas>
<div id="stick"><div id="knob"></div></div>
<div id="hint"></div>
<div id="intro"><div>
  <h1>THE MONARCH AWARDS 2026</h1>
  <h2>VENUE WALKTHROUGH</h2>
  <p id="how"></p>
  <button id="go">START</button>
  <small>Illustrative 3D mock-up built from the deck floor plan.<br>Not the final layout and not a scaled drawing.</small>
</div></div>
<div id="err"></div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var errEl=document.getElementById('err');
window.addEventListener('error',function(e){errEl.textContent='Error: '+e.message+' (line '+e.lineno+')';});
if(!window.THREE){errEl.textContent='3D library failed to load.';return;}
var T=THREE,PI=Math.PI;
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
document.getElementById('how').textContent=isTouch
  ?'Use the pad at bottom-left to walk and turn. Drag anywhere else to look around. Tap a button at the top to jump to an area.'
  :'Arrow keys to walk and turn (W A S D also works, Shift to go faster). Drag with the mouse to look around. Use the buttons at the top to jump to an area.';
document.getElementById('hint').textContent=isTouch?'Pad: walk + turn · Drag: look':'↑ ↓ walk · ← → turn · drag to look · Shift = faster';

/* seeded random so the scene is identical on every load */
var seed=20261110;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}

/* ---------- venue dimensions (metres, from the plan: 172'11" x 102'4") ---------- */
var HW=26.35,HD=15.6,CEIL=7.6;
var FOY_X0=-14.5,FOY_Z1=26.8,FOY_H=4.2;
var DOORS=[23.35],DW=1.6;                       // guest door (x) from the foyer onto the red carpet
var STAGE_BACK=-24.1,STAGE_FRONT=-18.65,STAGE_HALF=12.5,STAGE_H=1.0;
var SELFIE={x:22.0,z:22.4,bx:20.5,gap:1.7};      // bx = butterfly centre, gap = half-width of the double door
var LOB={x1:HW+17,hw:2.3,h:3.4};                 // bare arrival hallway east of the foyer
var RISERS=[[-HW+46.25,-7.85,1.7,9.7],[-HW+46.25,7.4,1.7,11.4]];
var RC={x0:-HW+48.6,x1:HW-0.9,z0:-12.9,z1:13.1};
var BUFFETS=[[-HW+20.5,HD+5.4,9.4,2.0],[-HW+20.5,HD+8.85,9.4,2.0]];

/* ---------- renderer ---------- */
var canvas=document.getElementById('gl');
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
var DPR_MAX=Math.min(window.devicePixelRatio||1,isTouch?1.6:2),dpr=DPR_MAX;
renderer.setPixelRatio(dpr);
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
var MAXAN=Math.min(8,renderer.capabilities.getMaxAnisotropy());
/* one shadow map for the whole venue, drawn once (everything that casts is static) */
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
var scene=new T.Scene();scene.background=new T.Color(0x020308);
var camera=new T.PerspectiveCamera(68,1,0.08,300);camera.rotation.order='YXZ';
var gHall=new T.Group(),gFoyer=new T.Group(),gLobby=new T.Group(),labels=new T.Group();
scene.add(gHall);scene.add(gFoyer);scene.add(gLobby);scene.add(labels);

/* ---------- helpers ---------- */
var O=new T.Object3D(),M4=new T.Matrix4(),UP=new T.Vector3(0,1,0),DOWN=new T.Vector3(0,-1,0),VA=new T.Vector3();
var unitBox=new T.BoxGeometry(1,1,1);
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rep){var t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=MAXAN;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;}return t;}
function std(c,o){o=o||{};o.color=c;return new T.MeshStandardMaterial(o);}
function basic(c,o){o=o||{};o.color=c;return new T.MeshBasicMaterial(o);}
function add(m,x,y,z,p){m.position.set(x||0,y||0,z||0);p.add(m);return m;}
function box(w,h,d,mat){return new T.Mesh(new T.BoxGeometry(w,h,d),mat);}
function mk(x,y,z,sx,sy,sz,rx,ry,rz){O.position.set(x,y,z);O.rotation.set(rx||0,ry||0,rz||0);
  O.scale.set(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz);O.updateMatrix();return O.matrix.clone();}
/* matrix that stretches a unit-height +Y rod from a to b */
function rodM(a,b,rs){VA.set(b[0]-a[0],b[1]-a[1],b[2]-a[2]);var L=VA.length();O.position.set(a[0],a[1],a[2]);
  O.quaternion.setFromUnitVectors(UP,VA.normalize());O.scale.set(rs,L,rs);O.updateMatrix();return O.matrix.clone();}
/* collect many copies of one shape and draw them in a single call */
function Batch(geo,mat,parent){this.g=geo;this.mat=mat;this.p=parent;this.m=[];}
Batch.prototype.add=function(x,y,z,sx,sy,sz,rx,ry,rz){this.m.push(mk(x,y,z,sx,sy,sz,rx,ry,rz));return this;};
Batch.prototype.addM=function(m){this.m.push(m.clone());return this;};
Batch.prototype.build=function(){if(!this.m.length)return null;var im=new T.InstancedMesh(this.g,this.mat,this.m.length);
  for(var i=0;i<this.m.length;i++)im.setMatrixAt(i,this.m[i]);im.instanceMatrix.needsUpdate=true;this.p.add(im);this.mesh=im;return im;};
function plane(grp,mat,w,d,x,y,z,up,ru,rv){var g=new T.PlaneGeometry(w,d);
  if(ru){var uv=g.attributes.uv;for(var i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*ru,uv.getY(i)*rv);}
  var m=new T.Mesh(g,mat);m.rotation.x=up?-PI/2:PI/2;m.position.set(x,y,z);m.receiveShadow=!!up;grp.add(m);return m;}
/* box with softened edges and smooth normals (cushions) */
function roundedBox(w,h,d,r,seg){var g=new T.BoxGeometry(w,h,d,seg[0],seg[1],seg[2]),p=g.attributes.position,n=g.attributes.normal,v=new T.Vector3();
  for(var i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    var cx=Math.max(-w/2+r,Math.min(w/2-r,v.x)),cy=Math.max(-h/2+r,Math.min(h/2-r,v.y)),cz=Math.max(-d/2+r,Math.min(d/2-r,v.z));
    var dx=v.x-cx,dy=v.y-cy,dz=v.z-cz,l=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(l>1e-6){p.setXYZ(i,cx+dx/l*r,cy+dy/l*r,cz+dz/l*r);n.setXYZ(i,dx/l,dy/l,dz/l);}}
  return g;}

/* mark what casts / receives shadows (drapes are left out: they are lit from within) */
function sh(o,c,r){o.traverse(function(m){if(m.isMesh||m.isInstancedMesh){var f=typeof fabricM!=='undefined'&&m.material===fabricM;m.castShadow=!!c&&!f;m.receiveShadow=!!r&&!f;}});return o;}

/* ---------- image-based lighting ---------- */
var pm=new T.PMREMGenerator(renderer);
function envCanvas(draw){var c=cv(1024,512);draw(c.getContext('2d'));var t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;
  t.mapping=T.EquirectangularReflectionMapping;var e=pm.fromEquirectangular(t).texture;t.dispose();return e;}
function blob(g,x,y,r,col){var rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);}
/* bright, warm, evenly lit corridor */
var envLobby=envCanvas(function(g){var gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#fffaf0');gr.addColorStop(.32,'#f3ecdf');gr.addColorStop(.55,'#dcd3c4');gr.addColorStop(1,'#8e8478');g.fillStyle=gr;g.fillRect(0,0,1024,512);
  for(var i=0;i<12;i++)blob(g,40+i*85,70+(i%2)*40,46,'rgba(255,255,255,1)');});
/* dimmed house lights for the hall's white walls and ceiling */
var envHouse=envCanvas(function(g){var gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#807f84');gr.addColorStop(.5,'#77767c');gr.addColorStop(1,'#3a3a40');g.fillStyle=gr;g.fillRect(0,0,1024,512);});
/* stand-in until the real hall is captured below */
var envBoot=envCanvas(function(g){var gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#05070f');gr.addColorStop(.42,'#0a2a6a');gr.addColorStop(.5,'#2a7bd8');gr.addColorStop(.58,'#0a1f4a');gr.addColorStop(1,'#020308');g.fillStyle=gr;g.fillRect(0,0,1024,512);
  for(var i=0;i<90;i++)blob(g,rnd()*1024,236+rnd()*110,6+rnd()*10,'rgba(255,205,140,.9)');});
scene.environment=envBoot;

/* ---------- procedural textures ---------- */
function speck(g,S,n,a){for(var i=0;i<n;i++){g.fillStyle=rnd()<0.5?'rgba(255,255,255,'+a+')':'rgba(0,0,0,'+a+')';g.fillRect(rnd()*S,rnd()*S,1.6,1.6);}}
var wallT=(function(){var S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#f4f2ed';g.fillRect(0,0,S,S);speck(g,S,1600,0.025);
  function frame(m,lw){g.lineWidth=lw;g.strokeStyle='rgba(120,116,108,.5)';g.beginPath();g.moveTo(m,S-m);g.lineTo(m,m);g.lineTo(S-m,m);g.stroke();
    g.strokeStyle='rgba(255,255,255,.95)';g.beginPath();g.moveTo(S-m,m);g.lineTo(S-m,S-m);g.lineTo(m,S-m);g.stroke();}
  frame(22,2.5);frame(29,1.4);return tex(c,true);})();
var marbleT=(function(){var S=512,c=cv(S,S),g=c.getContext('2d');g.fillStyle='#ebe5da';g.fillRect(0,0,S,S);
  for(var i=0;i<26;i++){var x=rnd()*S,y=rnd()*S,ang=rnd()*PI;
    g.strokeStyle='rgba('+((150+rnd()*40)|0)+','+((140+rnd()*30)|0)+','+((125+rnd()*30)|0)+','+(0.05+rnd()*0.1)+')';g.lineWidth=1+rnd()*5;
    g.shadowColor='rgba(140,130,115,.5)';g.shadowBlur=8;g.beginPath();g.moveTo(x,y);
    for(var k=0;k<6;k++){ang+=(rnd()-0.5)*0.9;x+=Math.cos(ang)*70;y+=Math.sin(ang)*70;g.lineTo(x,y);}g.stroke();}
  g.shadowBlur=0;g.strokeStyle='rgba(125,116,104,.75)';g.lineWidth=2;
  for(i=0;i<=2;i++){g.beginPath();g.moveTo(i*256,0);g.lineTo(i*256,S);g.moveTo(0,i*256);g.lineTo(S,i*256);g.stroke();}
  return tex(c,true);})();
function pileTex(base,a,pattern){var S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,S,S);speck(g,S,5200,a);
  if(pattern){g.strokeStyle=pattern;g.lineWidth=1.4;for(var k=-4;k<8;k++){g.beginPath();g.moveTo(k*64,0);g.lineTo(k*64+S,S);g.moveTo(k*64,S);g.lineTo(k*64+S,0);g.stroke();}}
  return tex(c,true);}
var carpetT=pileTex('#6b6157',0.07,'rgba(210,196,172,.16)'),redT=pileTex('#a50f18',0.09),blueT=pileTex('#0d2a8a',0.08),blackT=pileTex('#111216',0.06);
var glowT=(function(){var c=cv(64,64),g=c.getContext('2d'),rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.3,'rgba(255,255,255,.45)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);return tex(c);})();

/* ---------- materials ---------- */
var M={};
M.velvet=new T.MeshPhysicalMaterial({color:0x09090b,roughness:0.95,metalness:0,sheen:1,sheenRoughness:0.42,sheenColor:new T.Color(0x41414f)});
M.cloth=new T.MeshPhysicalMaterial({color:0xa9b2c4,roughness:0.84,metalness:0,sheen:1,sheenRoughness:0.33,sheenColor:new T.Color(0xf2f6ff)});
M.chrome=std(0xe9ebef,{roughness:0.12,metalness:1,envMapIntensity:1.6});
M.mirror=std(0xf3ece2,{roughness:0.05,metalness:1,envMapIntensity:1.9,flatShading:true,emissive:0x6b5d4c,emissiveIntensity:0.22});
M.glassTop=std(0xdfe8ee,{roughness:0.03,metalness:0.9,envMapIntensity:2.0,transparent:true,opacity:0.85});
M.glass=new T.MeshStandardMaterial({color:0x98a2ad,roughness:0.03,metalness:1,envMapIntensity:2.4,transparent:true,opacity:0.6,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
M.plate=std(0xf7f5f0,{roughness:0.2,metalness:0,envMapIntensity:1.1,emissive:0x2c2219});
M.napkin=std(0x10204c,{roughness:0.9,emissive:0x050a18});
M.cutlery=std(0xeceef2,{roughness:0.18,metalness:1,envMapIntensity:1.6});
M.wax=std(0xfff1d6,{roughness:0.6,emissive:0xff8a30,emissiveIntensity:0.6});
M.flame=basic(0xfff3cf,{toneMapped:false});
M.black=std(0x0b0c10,{roughness:0.85});
M.fixture=std(0x15171c,{roughness:0.45,metalness:0.6});
M.truss=std(0xa9afb8,{roughness:0.38,metalness:1,envMapIntensity:1.2});
M.led=basic(0x49a8ff,{toneMapped:false});
function wallMat(env,k){return new T.MeshStandardMaterial({color:0xffffff,map:wallT,roughness:0.88,metalness:0,envMap:env,envMapIntensity:k,side:T.DoubleSide});}
function whiteMat(env,k,r){return new T.MeshStandardMaterial({color:0xf6f4ef,roughness:r||0.9,metalness:0,envMap:env,envMapIntensity:k});}
/* satin drape: lit by the moving spots, with its uplight glow baked into the vertices */
var fabricM=new T.MeshStandardMaterial({color:0x0b2c78,vertexColors:true,side:T.DoubleSide,roughness:0.62,metalness:0,envMapIntensity:0.15});
fabricM.onBeforeCompile=function(sh){sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>','')
  .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n\ttotalEmissiveRadiance += vColor.rgb;');};

/* pleated flat drape in the XY plane facing +Z, uplit every `gap` metres */
function drapeWall(len,h,opt){
  opt=opt||{};var segX=Math.max(8,Math.round(len*7)),segY=10;
  var geo=new T.PlaneGeometry(len,h,segX,segY),p=geo.attributes.position,col=new Float32Array(p.count*3);
  var gap=opt.gap||2.6,d=[0.003,0.012,0.06],l=[0.05,0.3,1.0],amp=opt.amp||0.07;
  for(var i=0;i<p.count;i++){
    var x=p.getX(i)+len/2,y=p.getY(i)+h/2,ph=x*11.5;
    p.setZ(i,Math.sin(ph)*amp+Math.sin(ph*0.37)*amp*0.5);
    var fold=Math.pow(0.5+0.5*Math.sin(ph+1.1),1.6);
    var dx=((x+gap/2)%gap)-gap/2,glow=Math.exp(-dx*dx/0.22)*Math.exp(-y/(h*0.42));
    var k=0.25+0.75*fold,a=Math.min(1,glow*1.5)*k+0.04*k;
    col[i*3]=d[0]+(l[0]-d[0])*a;col[i*3+1]=d[1]+(l[1]-d[1])*a;col[i*3+2]=d[2]+(l[2]-d[2])*a+0.04*k;
  }
  geo.setAttribute('color',new T.BufferAttribute(col,3));geo.translate(0,h/2,0);geo.computeVertexNormals();
  return new T.Mesh(geo,fabricM);
}
/* swept fabric: strand(u,t) -> [x,y]; u across the cloth, t along each fold */
function fabric(strand,nu,nt,pleats,dark,light,zoff,amp){
  var pos=[],col=[],idx=[],i,j;
  for(i=0;i<=nu;i++){var u=i/nu,ph=u*pleats*2*PI;
    for(j=0;j<=nt;j++){var t=j/nt,s=strand(u,t);
      var fold=Math.pow(0.5+0.5*Math.sin(ph+0.9),2.2);
      pos.push(s[0],s[1],zoff+Math.sin(ph)*amp*(0.35+0.65*Math.sin(t*PI*0.9+0.15)));
      var lit=0.28+0.72*Math.exp(-s[1]/3.2),a=fold*lit+0.04;
      col.push(dark[0]+(light[0]-dark[0])*a,dark[1]+(light[1]-dark[1])*a,dark[2]+(light[2]-dark[2])*a);
    }}
  for(i=0;i<nu;i++)for(j=0;j<nt;j++){var a0=i*(nt+1)+j,b0=a0+nt+1;idx.push(a0,b0,a0+1,b0,b0+1,a0+1);}
  var g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
  return new T.Mesh(g,fabricM);
}
function bez(p0,p1,p2,t){var m=1-t;return [m*m*p0[0]+2*m*t*p1[0]+t*t*p2[0],m*m*p0[1]+2*m*t*p1[1]+t*t*p2[1]];}
/* mirrored copy below the polished hall floor = cheap reflection */
function reflect(obj){return null;}   /* carpet does not reflect: the mirrored copies are no longer made */

/* ---------- room shells ---------- */
function shell(grp,env,k){grp.userData.wall=wallMat(env,k);grp.userData.skirt=new Batch(unitBox,whiteMat(env,k,0.45),grp);}
shell(gHall,envHouse,1.0);shell(gFoyer,envLobby,0.5);shell(gLobby,envLobby,1.0);
function wall(grp,x0,z0,x1,z1,h,y0,noSkirt){var len=Math.hypot(x1-x0,z1-z0),g=new T.PlaneGeometry(len,h),uv=g.attributes.uv;
  var nx=Math.max(1,Math.round(len/2.0)),ny=Math.max(1,Math.round(h/2.6));

  else if(m.kind===3)tg.set(STAGE_FRONT+1.5+2.5*Math.sin(t*0.29+p),0,m.z0*0.9+3.5*Math.sin(t*0.35+p));                 /* floor in front of the stage */
  else tg.set(STAGE_FRONT+10+7*Math.sin(t*0.23+p),0.2,m.z0*1.2+7*Math.sin(t*0.19+p*2.1));                              /* aerial beams over the room */
  VA.copy(tg).sub(m.pos);var L=VA.length();VA.normalize();m.head.quaternion.setFromUnitVectors(DOWN,VA);
  var bl=m.kind===2?Math.min(L,15):L;m.beam.scale.set(bl*tanA,bl,bl*tanA);
  m.col.setHSL(0.585+0.05*Math.sin(t*0.21+p*3.0),0.8,0.64+0.14*Math.sin(t*0.33+p));
  m.bm.uniforms.uColor.value.copy(m.col);m.lens.material.color.copy(m.col).lerp(WHITE,0.6);
  if(m.light){m.light.color.copy(m.col);m.light.target.position.copy(tg);}}}
updateMovers(0);

/* ---------- player ---------- */
var P={x:LOB.x1-2.0,z:SELFIE.z,yaw:PI/2,pitch:0,eye:1.65,h:0};
var SPOTS={

  stage:{x:-9.5,z:0,yaw:PI/2,pitch:0.1,label:'Stage'},

var overview=false,chips=document.getElementById('chips');
function go(k){overview=false;var s=SPOTS[k];P.x=s.x;P.z=s.z;P.yaw=s.yaw;P.pitch=s.pitch;P.h=floorH(P.x,P.z);eyeY=P.h+P.eye;mark(k);}
function mark(k){[].forEach.call(chips.children,function(b){if(b.dataset.k!=='labels')b.classList.toggle('on',b.dataset.k===k);});}
function chip(k,txt,fn){var b=document.createElement('button');b.textContent=txt;b.dataset.k=k;b.addEventListener('click',function(e){e.preventDefault();fn();canvas.focus();});chips.appendChild(b);return b;}
Object.keys(SPOTS).forEach(function(k){if(!SPOTS[k].hide)chip(k,SPOTS[k].label,function(){go(k);});});

var houseOn=false,hb=chip('labels','House lights',function(){houseOn=!houseOn;hb.classList.toggle('on',houseOn);
  gHall.userData.wall.envMapIntensity=houseOn?2.3:1.0;hallCeilM.envMapIntensity=houseOn?2.2:0.8;house.intensity=houseOn?3.6:2.0;floorM.envMapIntensity=houseOn?2.0:0.9;});

function floorH(x,z){
  if(x<STAGE_FRONT&&Math.abs(z)<STAGE_HALF)return STAGE_H;
  var d=Math.hypot(x-STAGE_FRONT,z);if(x>=STAGE_FRONT){if(d<3.6)return 1.0;if(d<4.6)return 0.66;if(d<5.6)return 0.33;}
  return 0;
}
function inBox(x,z,b,m){return Math.abs(x-b[0])<b[2]/2+m&&Math.abs(z-b[1])<b[3]/2+m;}
function ok(x,z){
  var m=0.45,i;
  var inHall=x>-HW+m&&x<HW-m&&z>-HD+m&&z<HD-m;
  var inFoy=x>FOY_X0+m&&x<HW-m&&z>HD+m&&z<FOY_Z1-m;
  var inDoor=false;for(i=0;i<DOORS.length;i++)if(Math.abs(x-DOORS[i])<1.25&&z>HD-m-0.05&&z<HD+m+0.05)inDoor=true;
  var inLob=x>HW+m&&x<LOB.x1-m&&Math.abs(z-SELFIE.z)<LOB.hw-m;
  var inDD=Math.abs(x-HW)<=m+0.05&&Math.abs(z-SELFIE.z)<SELFIE.gap-0.35&&doorOpen>0.55;
  if(!(inHall||inFoy||inDoor||inLob||inDD))return false;
  if(inHall){
    if(x<STAGE_BACK+1.3)return false;
    if(x<STAGE_FRONT+0.4&&x>STAGE_FRONT-0.4&&Math.abs(z)<STAGE_HALF+0.4&&Math.abs(z)>3.5)return false; /* stage front edge: use the steps */
    if(x<STAGE_FRONT&&Math.abs(z)>STAGE_HALF-0.1&&Math.abs(z)<STAGE_HALF+0.4)return false;
    if(x>RC.x1-1.6&&z>RC.z0-0.3&&z<RC.z1+0.3)return false;
    if(Math.abs(x-(-HW+12.6))<0.7&&Math.abs(Math.abs(z)-13.2)<2.1)return false;
    for(i=0;i<RISERS.length;i++)if(inBox(x,z,RISERS[i],0.3))return false;
    for(i=0;i<TABLES.length;i++){var dx=x-TABLES[i][0],dz=z-TABLES[i][1];if(dx*dx+dz*dz<1.56*1.56)return false;}
  }
  if(inFoy){
    for(i=0;i<BUFFETS.length;i++)if(inBox(x,z,BUFFETS[i],0.35))return false;
    if(Math.hypot(x-SELFIE.bx,z-SELFIE.z)<2.35)return false;
  }
  return true;
}

/* ---------- input ---------- */
var keys={},joy={x:0,y:0,id:null},look={id:null,x:0,y:0};
window.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};});
var stick=document.getElementById('stick'),knob=document.getElementById('knob');
function setKnob(){knob.style.transform='translate('+(joy.x*38)+'px,'+(joy.y*38)+'px)';}
stick.addEventListener('pointerdown',function(e){joy.id=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(_){ }moveJoy(e);e.preventDefault();});
stick.addEventListener('pointermove',function(e){if(e.pointerId===joy.id)moveJoy(e);});
function endJoy(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;setKnob();}}
stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);
function moveJoy(e){var r=stick.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/(r.width/2),dy=(e.clientY-(r.top+r.height/2))/(r.height/2);
  var l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}joy.x=dx;joy.y=dy;setKnob();}
canvas.addEventListener('pointerdown',function(e){if(look.id!==null)return;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(_){ }canvas.focus();});
canvas.addEventListener('pointermove',function(e){if(e.pointerId!==look.id||overview)return;var k=isTouch?0.0052:0.0034;
  P.yaw-=(e.clientX-look.x)*k;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(e.clientY-look.y)*k));look.x=e.clientX;look.y=e.clientY;});
function endLook(e){if(e.pointerId===look.id)look.id=null;}
canvas.addEventListener('pointerup',endLook);canvas.addEventListener('pointercancel',endLook);
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.getElementById('go').addEventListener('click',function(){document.getElementById('intro').style.display='none';canvas.focus();});

/* ---------- minimap ---------- */
var ROUTE=[[LOB.x1-1.5,SELFIE.z],[DOORS[0],SELFIE.z],[DOORS[0],HD],[DOORS[0],-0.65],[RISERS[0][0]-3.2,-0.65]];
var map=document.getElementById('map'),mg=map.getContext('2d'),mapBg=cv(264,212);
var MS=264/(HW+LOB.x1+1.6),MOX=0.8,MOZ=0.8;
function mx(x){return (x+HW+MOX)*MS;}function mz(z){return (z+HD+MOZ)*MS;}
(function(){var g=mapBg.getContext('2d');
  g.fillStyle='#10141f';g.fillRect(mx(-HW),mz(-HD),HW*2*MS,HD*2*MS);g.fillStyle='#1b1a18';g.fillRect(mx(FOY_X0),mz(HD),foyW*MS,foyD*MS);
  g.fillStyle='#3a332b';g.fillRect(mx(HW),mz(SELFIE.z-LOB.hw),(LOB.x1-HW)*MS,LOB.hw*2*MS);
  g.fillStyle='#5a6a86';g.fillRect(mx(-HW+1.8),mz(-STAGE_HALF),(STAGE_FRONT+HW-1.8)*MS,STAGE_HALF*2*MS);
  g.beginPath();g.arc(mx(STAGE_FRONT),mz(0),5.6*MS,-PI/2,PI/2);g.fillStyle='#46536b';g.fill();
  g.fillStyle='#2f6bff';g.fillRect(mx(-HW+0.2),mz(-HD+0.3),1.6*MS,(HD*2-0.6)*MS);
  g.fillStyle='#38bdf8';g.fillRect(mx(-HW+12.2),mz(-15.2),0.9*MS,4*MS);g.fillRect(mx(-HW+12.2),mz(11.2),0.9*MS,4*MS);
  g.fillStyle='#d8c08a';TABLES.forEach(function(t){g.beginPath();g.arc(mx(t[0]),mz(t[1]),1.0*MS,0,PI*2);g.fill();});
  g.fillStyle='#000';g.strokeStyle='#666';RISERS.forEach(function(r){g.fillRect(mx(r[0]-r[2]/2),mz(r[1]-r[3]/2),r[2]*MS,r[3]*MS);g.strokeRect(mx(r[0]-r[2]/2),mz(r[1]-r[3]/2),r[2]*MS,r[3]*MS);});
  g.fillStyle='#c0151f';g.fillRect(mx(RC.x0),mz(RC.z0),(RC.x1-RC.x0)*MS,(RC.z1-RC.z0)*MS);
  g.fillStyle='#999';BUFFETS.forEach(function(b){g.fillRect(mx(b[0]-b[2]/2),mz(b[1]-b[3]/2),b[2]*MS,b[3]*MS);});
  g.fillStyle='#1d3fbf';g.fillRect(mx(SELFIE.x-3.9),mz(SELFIE.z-3.8),7.8*MS,7.6*MS);g.fillStyle='#e8eefc';g.beginPath();g.arc(mx(SELFIE.bx),mz(SELFIE.z),1.6*MS,0,PI*2);g.fill();
  g.strokeStyle='#7f9fd8';g.lineWidth=1.5;g.strokeRect(mx(-HW),mz(-HD),HW*2*MS,HD*2*MS);g.strokeRect(mx(FOY_X0),mz(HD),foyW*MS,foyD*MS);g.strokeRect(mx(HW),mz(SELFIE.z-LOB.hw),(LOB.x1-HW)*MS,LOB.hw*2*MS);
  g.strokeStyle='#d9b36a';g.lineWidth=3;g.beginPath();g.moveTo(mx(HW),mz(SELFIE.z-SELFIE.gap));g.lineTo(mx(HW),mz(SELFIE.z+SELFIE.gap));g.stroke();
  g.strokeStyle='#10141f';g.lineWidth=3;DOORS.forEach(function(d){g.beginPath();g.moveTo(mx(d-1.5),mz(HD));g.lineTo(mx(d+1.5),mz(HD));g.stroke();});
  g.strokeStyle='rgba(255,201,60,.75)';g.lineWidth=2;g.lineJoin='round';g.setLineDash([5,4]);g.beginPath();ROUTE.forEach(function(p,i){if(i)g.lineTo(mx(p[0]),mz(p[1]));else g.moveTo(mx(p[0]),mz(p[1]));});g.stroke();g.setLineDash([]);
})();
function drawMap(){mg.clearRect(0,0,264,212);mg.drawImage(mapBg,0,0);
  var x=mx(P.x),z=mz(P.z),fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  mg.fillStyle='rgba(255,255,255,.18)';mg.beginPath();mg.moveTo(x,z);mg.arc(x,z,34,Math.atan2(fz,fx)-0.55,Math.atan2(fz,fx)+0.55);mg.closePath();mg.fill();
  mg.fillStyle='#fff';mg.strokeStyle='#ff4d6a';mg.lineWidth=3;mg.beginPath();mg.arc(x,z,6,0,PI*2);mg.fill();mg.stroke();}

/* ---------- loop ---------- */
function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
var last=performance.now(),eyeY=P.eye,clock=0,fAcc=0,fN=0,calm=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000),raw=now-last;last=now;clock+=dt;
  /* keep it smooth on slower phones: drop the render resolution a notch if frames run long, restore it when there is headroom */
  fAcc+=raw;fN++;if(fN>=45){var avg=fAcc/fN;fAcc=0;fN=0;
    if(avg>38&&dpr>1){dpr=Math.max(1,dpr-0.25);calm=0;resize();}
    else if(avg<19&&dpr<DPR_MAX){if(++calm>=4){dpr=Math.min(DPR_MAX,dpr+0.25);calm=0;resize();}}else calm=0;}
  var f=0,st=0,turn=0;
  if(keys.ArrowUp||keys.KeyW)f+=1;if(keys.ArrowDown||keys.KeyS)f-=1;
  if(keys.ArrowLeft)turn+=1;if(keys.ArrowRight)turn-=1;if(keys.KeyA)st-=1;if(keys.KeyD)st+=1;if(keys.KeyQ)turn+=1;if(keys.KeyE)turn-=1;
  if(joy.id!==null){f-=joy.y;if(Math.abs(joy.x)>0.18)turn-=joy.x*0.9;}
  if((f||st||turn)&&overview){overview=false;mark('');}
  if(!overview){
    P.yaw+=turn*1.9*dt;
    var sp=((keys.ShiftLeft||keys.ShiftRight)?9:4.6)*dt,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
    var dx=(fx*f+(-fz)*st)*sp,dz=(fz*f+fx*st)*sp;
    if(dx||dz){if(ok(P.x+dx,P.z+dz)){P.x+=dx;P.z+=dz;}else if(ok(P.x+dx,P.z))P.x+=dx;else if(ok(P.x,P.z+dz))P.z+=dz;}
    P.h=floorH(P.x,P.z);eyeY+=(P.h+P.eye-eyeY)*Math.min(1,dt*10);
    camera.up.set(0,1,0);camera.position.set(P.x,eyeY,P.z);camera.rotation.set(P.pitch,P.yaw,0);
    if(camera.fov!==68){camera.fov=68;camera.updateProjectionMatrix();}
  }else{
    var portrait=camera.aspect<1,cx=(LOB.x1-HW)/2,cz=(FOY_Z1-HD)/2;
    var spanX=HW+LOB.x1+4,spanZ=(FOY_Z1+HD)+4,horiz=portrait?spanZ:spanX,vert=portrait?spanX:spanZ;
    var tv=Math.tan(25*PI/180),hgt=Math.max(vert/2/tv,horiz/2/(tv*camera.aspect))+CEIL;
    if(camera.fov!==50){camera.fov=50;camera.updateProjectionMatrix();}
    camera.position.set(cx,hgt,cz);camera.up.set(portrait?-1:0,0,portrait?0:-1);camera.lookAt(cx,0,cz);
  }
  /* only draw the rooms you can actually see from where you stand */
  var inLob=P.x>HW+0.25;
  gHall.visible=overview||!inLob;gLobby.visible=overview||P.z>HD-2.5;
  for(var hi=0;hi<halos.length;hi++)halos[hi].visible=!overview;
  var near=!overview&&Math.hypot(P.x-HW,P.z-SELFIE.z)<5.2;
  doorOpen+=((near?1:0)-doorOpen)*Math.min(1,dt*2.6);
  for(var li=0;li<leaves.length;li++)leaves[li].p.rotation.y=leaves[li].k*doorOpen*1.5;
  updateMovers(clock);ledU.t.value=clock;candleU.t.value=clock;
  candleU.sc.value=0.21*canvas.height/(2*Math.tan(camera.fov*PI/360));
  renderer.render(scene,camera);drawMap();
  if(showStats)errEl.textContent='calls '+renderer.info.render.calls+' · tris '+renderer.info.render.triangles+' · dpr '+dpr;
  requestAnimationFrame(frame);
}
/* optional #stage / #tables / … deep links */
var showStats=false;
function fromHash(){var k=(location.hash||'').slice(1);
  if(k.slice(-2)==='-s'){showStats=true;k=k.slice(0,-2);}if(k.slice(-2)==='-h'){k=k.slice(0,-2);if(!houseOn)hb.click();}
if(k==='top'){overview=true;mark('top');return true;}if(SPOTS[k]){go(k);return true;}return false;}
window.addEventListener('hashchange',fromHash);
if(!fromHash()){P.h=0;mark('');}else{document.getElementById('intro').style.display='none';}
requestAnimationFrame(frame);
})();
